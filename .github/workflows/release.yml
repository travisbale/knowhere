name: Release

# A Go module is published by tagging it — the proxy serves the tag directly, with no
# build or upload. This only records what changed, so a consumer deciding whether to bump
# has something to read.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publish release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish the release
        # Pinned to a commit, unlike actions/checkout above: that one is GitHub's, this is
        # an individual's, and a moved tag would inherit this job's contents:write token.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
